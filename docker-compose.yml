services:
  app:
    image: ghcr.io/mrkaqz/drillingdb:latest
    ports:
      - "7000:7000"
    environment:
      - DATA_DIR=/data
    volumes:
      - drilling_db:/data/db
      - drilling_uploads:/data/uploads
      - drilling_exports:/data/exports
    restart: unless-stopped

volumes:
  drilling_db:       # SQLite database file
  drilling_uploads:  # Uploaded source xlsx files
  drilling_exports:  # Generated export xlsx files
