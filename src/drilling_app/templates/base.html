<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Drilling Motor Output DB{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .nav-link { @apply px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:text-blue-700 hover:bg-blue-50 transition-all duration-200; }
    .nav-link.active { @apply text-blue-600 bg-blue-50; }
    .btn-primary { @apply bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors; }
    .btn-secondary { @apply bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors; }
    .btn-danger { @apply bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors; }
    .card { @apply bg-white rounded-xl shadow-sm p-6 border border-gray-200; }
    .table-head { @apply bg-gray-50 px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider; }
    .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center h-16">
        <a href="/" class="flex items-center gap-2 no-underline group">
          <span class="text-blue-600 text-2xl group-hover:scale-110 transition-transform">⛏</span>
          <span class="text-gray-900 font-bold text-lg tracking-tight group-hover:text-blue-600 transition-colors">Motor Output DB</span>
        </a>

        <div class="h-8 w-px bg-gray-200 mx-6"></div> <!-- Main Separator -->
        
        <div class="hidden md:flex items-center gap-2" x-data="{ currentPath: window.location.pathname }">
          <a href="/" class="nav-link hover:text-blue-600" :class="{ 'active': currentPath === '/' }">Dashboard</a>
          <div class="w-px h-4 bg-gray-200"></div>
          <a href="/import" class="nav-link hover:text-blue-600" :class="{ 'active': currentPath === '/import' }">Import</a>
          <div class="w-px h-4 bg-gray-200"></div>
          <a href="/batch-import" class="nav-link hover:text-blue-600" :class="{ 'active': currentPath === '/batch-import' }">Batch Import</a>
          <div class="w-px h-4 bg-gray-200"></div>
          <a href="/wells" class="nav-link hover:text-blue-600" :class="{ 'active': currentPath.startsWith('/wells') }">Wells</a>
          <div class="w-px h-4 bg-gray-200"></div>
          <a href="/compare" class="nav-link hover:text-blue-600" :class="{ 'active': currentPath === '/compare' }">Compare</a>
          <div class="w-px h-4 bg-gray-200"></div>
          <a href="/benchmarks" class="nav-link hover:text-blue-600" :class="{ 'active': currentPath === '/benchmarks' }">Benchmarks</a>
          <div class="w-px h-4 bg-gray-200"></div>
          <a href="/bha-configs" class="nav-link hover:text-blue-600" :class="{ 'active': currentPath === '/bha-configs' }">BHA Library</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
  {% block content %}{% endblock %}
</main>

</body>
</html>
