name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest

    env:
      SESSION_SECRET_KEY: ci-test-secret-key
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test — import app
        run: python -c "from drilling_app.main import app; print('App loaded OK, version', app.version)"

      - name: Run tests
        run: pytest tests/ -v --tb=short
